name: TrueLens
description: 'TrueLens was a marketing-technology startup providing social media analytics
  and customer intelligence. Its product, Socialgraphics, helped brands target customers
  using data compiled and analyzed from multiple social networks for marketing campaigns.
  Google Ventures (GV) led a roughly $1.2M funding round in 2012; the company was small
  (2-10 employees). TrueLens now appears defunct: its former domain truelens.com 301-redirects
  to an unrelated retailer (misterspex.de), and no public API, developer portal, or
  documentation could be found. It was added to the API Evangelist network as a GV portfolio
  lead; there is no live API surface to enrich.'
